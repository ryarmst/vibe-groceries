# vibe-groceries on a VPS: Caddy (HTTPS, optional mTLS) in front of the app. Only Caddy is published.
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
name: vibe-groceries

services:
  app:
    build: ../server
    image: vibe-groceries:latest
    container_name: vibe-groceries
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
      FORWARDED_ALLOW_IPS: "*"     # only Caddy can reach the app (not published), so trust its X-Forwarded-For
    volumes:
      - app-data:/data              # database, secrets vault, CA key, backups: back this up
      - ca-public:/data/public      # only the CA certificate, shared read-only with Caddy
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  caddy:
    image: caddy:2-alpine
    container_name: vibe-groceries-caddy
    restart: unless-stopped
    environment:                     # only what Caddy needs; it never sees MASTER_KEY or API keys
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      MTLS_MODE: ${MTLS_MODE:-off}
    ports:
      - "80:80"       # certificate challenges and redirect to HTTPS
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ca-public:/ca:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

volumes:
  app-data:
  ca-public:
  caddy-data:
  caddy-config:
